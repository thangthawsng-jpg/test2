<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập | THT - Tech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/style-login.css" />
  </head>

  <body>
    <div class="auth-page container">
      <header class="top-header">
        <a href="./index.html" class="back-btn" aria-label="Quay về trang chủ">
          <i class="bi bi-arrow-left"></i>
          <span>Trang chủ</span>
        </a>

        <a href="./index.html" class="brand-link" aria-label="THT Tech">
          <img src="./assets/img/logo.png" alt="THT Tech" class="header-logo" />
        </a>

        <div class="header-spacer" aria-hidden="true"></div>
      </header>

      <main class="auth-shell mx-auto">
        <section class="login-panel" aria-labelledby="loginTitle">
          <div class="login-card">
            <div class="custom-alert" aria-live="polite"></div>

            <div class="login-heading">
              <img src="./assets/img/logo.png" alt="THT Tech" class="card-logo" />
              <span class="login-kicker">Chào mừng trở lại</span>
              <h2 id="loginTitle" class="login-title">Đăng nhập</h2>
              <p class="login-desc">Truy cập tài khoản THT Tech của bạn.</p>
            </div>

            <form id="loginForm" class="login-form">
              <label class="field-label" for="email">Email</label>
              <div class="input-group-custom">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" class="form-control custom-input" id="email" placeholder="you@example.com" autocomplete="email" required />
              </div>

              <label class="field-label" for="password">Mật khẩu</label>
              <div class="input-group-custom">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control custom-input" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
              </div>

              <div class="form-options">
                <label class="remember-option" for="rememberMe">
                  <input type="checkbox" id="rememberMe" />
                  <span>Ghi nhớ</span>
                </label>
                <a href="#" class="forgot-link">Quên mật khẩu?</a>
              </div>

              <button type="submit" class="btn login-btn w-100">
                <span>Đăng nhập</span>
              </button>
            </form>

            <div class="register-wrapper">
              <span>Chưa có tài khoản?</span>
              <a href="./create-account.html" class="register-link">Đăng ký</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="./assets/js/csript-login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
