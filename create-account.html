<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo tài khoản | THT - Tech</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/style-create-account.css" />
  </head>

  <body>
    <div class="container-fluid main-wrapper">
      <header class="top-bar">
        <a href="./index.html" class="back-btn" aria-label="Quay về trang chủ">
          <i class="bi bi-arrow-left"></i>
          <span>Trang chủ</span>
        </a>

        <a href="./index.html" class="brand-logo" aria-label="THT Tech">
          <img src="./assets/img/logo.png" alt="THT Tech" />
        </a>
        <div class="header-spacer" aria-hidden="true"></div>
      </header>

      <main class="main-card">
        <div class="row g-0 h-100">
          <div class="col-lg-6 d-none d-lg-block h-100">
            <div class="left-side h-100">
              <div class="badge-custom">✦ CÔNG NGHỆ HIỆN ĐẠI</div>

              <h1 class="hero-title">
                Tạo tài khoản<br />
                để trải nghiệm<br />
                hệ sinh thái<br />
                công nghệ tại<br />
                THT Tech
              </h1>

              <p class="hero-desc">Đăng ký để nhận ưu đãi thành viên, theo dõi đơn hàng và cập nhật công nghệ mới nhất từ HUIT.</p>

              <div class="row g-3 stats-grid">
                <div class="col-6">
                  <div class="stat-box">
                    <div class="stat-number" data-counter="1200">1200+</div>
                    <div class="stat-text">Khách hàng mỗi tuần</div>
                  </div>
                </div>

                <div class="col-6">
                  <div class="stat-box">
                    <div class="stat-number" data-counter="96">96%</div>
                    <div class="stat-text">Khách quay lại mua</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-12 h-100">
            <div class="right-side h-100">
              <div class="form-card">
                <div class="text-center mb-2">
                  <img src="./assets/img/logo.png" class="logo-form" alt="THT Tech" />
                </div>

                <h2 class="form-title">TẠO TÀI KHOẢN</h2>

                <form id="registerForm" class="register-form-shell">
                  <div class="input-group-custom">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" id="fullName" class="form-control form-control-custom" placeholder="Họ và tên" required />
                  </div>

                  <div class="input-group-custom">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control form-control-custom" placeholder="Email (you@example.com)" required />
                  </div>

                  <div class="input-group-custom">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="password" class="form-control form-control-custom password-input" placeholder="Mật khẩu" required />
                    <button type="button" class="toggle-password" aria-label="Hiện/Ẩn mật khẩu">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>

                  <div class="input-group-custom mb-4">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="confirmPassword" class="form-control form-control-custom password-input" placeholder="Nhập lại mật khẩu" required />
                    <button type="button" class="toggle-password" aria-label="Hiện/Ẩn mật khẩu">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>

                  <button type="submit" class="btn btn-register w-100" id="registerBtn">ĐĂNG KÝ</button>
                </form>

                <div class="login-text">
                  <span>Đã có tài khoản?</span>
                  <a href="./login.html">Đăng nhập</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="./assets/js/style-create-account.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
